<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEYI｜菜市場大冒險</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    :root{--ink:#26362d;--cream:#fff8e8;--red:#d94b36;--green:#237c58;--yellow:#ffd44d;--shadow:0 7px 0 #173c2c}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#f8dc9a;color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;display:grid;place-items:center;padding:18px}
    button{font:inherit;cursor:pointer;color:inherit} .game{width:min(1080px,100%);min-height:min(760px,calc(100vh - 36px));position:relative;overflow:hidden;border:5px solid #633d27;border-radius:26px;background:var(--cream);box-shadow:0 14px 0 #633d27,0 22px 45px #673e2850;display:flex;flex-direction:column}
    .awning{height:24px;background:repeating-linear-gradient(90deg,#d94b36 0 54px,#fff6d7 54px 108px);border-bottom:4px solid #633d27}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 10px;gap:12px}.brand{font-weight:900;font-size:clamp(19px,3vw,27px);letter-spacing:.03em}.brand span{color:var(--red)}.score{font-weight:800;background:#eaf2d7;border:2px solid #9cbd80;border-radius:99px;padding:7px 14px;white-space:nowrap}
    .main{flex:1;padding:4px 24px 20px;display:flex;flex-direction:column;gap:14px}.headline{text-align:center;margin:0;font-size:clamp(23px,4vw,38px);font-weight:900}.subtitle{text-align:center;margin:-10px 0 0;color:#6c746a;font-size:14px}
    .question{background:#fff;border:3px solid #ead5a9;border-radius:16px;padding:9px 18px;text-align:center}.question-label{font-size:12px;color:#7d776b;font-weight:700}.target{font-size:clamp(24px,4vw,34px);font-weight:900;color:var(--red);min-height:1.3em}.wedge.selected{filter:brightness(.62) saturate(.65)}
    .market{position:relative;flex:1;min-height:380px;border:3px solid #97b77e;border-radius:22px;background:linear-gradient(#d9f1e8 0 65%,#f5d08a 65%);overflow:hidden;padding:16px;display:grid;place-items:center}
    .market:before{content:'傳統市場・早安！';position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#4c765f;font-size:12px;font-weight:700;letter-spacing:.18em;white-space:nowrap;z-index:4}
    .market-screen{position:relative;width:min(420px,100%);height:auto;aspect-ratio:334 / 316;margin-top:12px}.market-screen.hidden{display:none}.sample-wheel{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:0}.wedge{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;clip-path:var(--slice);background:transparent;padding:0;transition:filter .14s;z-index:2}.wedge:nth-of-type(1){--slice:polygon(50% 54%,50% 0%,100% 37%)}.wedge:nth-of-type(2){--slice:polygon(50% 54%,100% 37%,82% 100%)}.wedge:nth-of-type(3){--slice:polygon(50% 54%,82% 100%,20% 100%)}.wedge:nth-of-type(4){--slice:polygon(50% 54%,20% 100%,0% 40%)}.wedge:nth-of-type(5){--slice:polygon(50% 54%,0% 40%,50% 0%)}.wedge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.wedge:hover,.wedge:focus-visible{filter:brightness(.9);outline:none}.wedge.active{filter:brightness(.65) saturate(1.2)}.drygoods-replacement{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:polygon(50% 54%,100% 37%,82% 100%);pointer-events:none;z-index:1}
    .pentagon-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.pentagon-lines polygon,.pentagon-lines line{fill:none;stroke:#fff;stroke-width:3}
    .hud{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center}.timerbox{text-align:center}.timertext{font-size:12px;font-weight:800;color:#6b756d}.timer{font-size:31px;line-height:1;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}.track{height:9px;border-radius:99px;background:#eadcc2;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;background:#56a96d;border-radius:inherit;transition:width .1s linear,background .2s}
    .prompt{text-align:center;font-weight:800;margin:0;font-size:14px}.help{text-align:center;color:#847969;font-size:12px;margin:0}.toast{position:absolute;z-index:4;top:54px;left:50%;transform:translate(-50%,-15px);padding:9px 17px;background:#253d31;color:white;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .overlay{position:absolute;z-index:5;inset:24px 0 0;background:#254534dc;display:grid;place-items:center;padding:20px}.modal{width:min(540px,100%);background:var(--cream);border:4px solid #633d27;border-radius:24px;box-shadow:0 9px 0 #633d27;padding:30px 28px;text-align:center}.modal .big{font-size:66px;line-height:1.2}.modal h2{font-size:clamp(26px,5vw,38px);margin:4px 0 8px}.modal p{color:#687166;line-height:1.7;margin:4px auto 18px;max-width:430px}.primary{border:0;border-radius:14px;background:var(--red);color:white;font-weight:900;font-size:19px;padding:12px 26px;box-shadow:0 5px 0 #9d3528}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9d3528}.hidden{display:none!important}
    @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .food-option img{inset:auto;left:var(--photo-left);top:var(--photo-top);width:var(--photo-width);height:var(--photo-height);object-fit:cover}
    .fruit-option img{object-fit:contain;mix-blend-mode:multiply}
    @media(max-width:700px){body{padding:8px}.game{min-height:calc(100vh - 22px);border-radius:18px}.awning{height:16px}header{padding:10px 14px 5px}.main{padding:4px 12px 14px;gap:10px}.market{min-height:300px;padding:12px 7px}.market-screen{width:min(300px,100%)}.hud{grid-template-columns:1fr;gap:8px}.timer{font-size:26px}.help{font-size:10px}}
    @media(max-width:390px){.market{min-height:275px;padding-inline:4px}.market-screen{width:min(270px,100%)}.score{font-size:12px;padding:5px 9px}}
  </style>
</head>
<body>
<div class="game" aria-label="IEYI 傳統市場遊戲">
  <div class="awning"></div>
  <header><div class="brand">IEYI <span>｜菜市場大冒險</span></div><div class="score" id="progress">任務 0 / 5</div></header>
  <main class="main">
    <h1 class="headline">市場採買任務</h1>
    <p class="subtitle" id="pageHint">第 1 頁｜先找到正確的攤商</p>
    <div class="question"><div class="question-label" id="questionLabel">選擇你想逛的攤商</div><div class="target" id="target"></div></div>
    <section class="market" aria-label="市場五角形操作區">
      <div class="market-screen" id="stallPage" aria-label="攤商選擇頁">
        <img class="sample-wheel" src="assets/market-stalls-wheel.png" alt="" />
        <img class="drygoods-replacement" src="assets/food/shiitake.jpg" alt="" />
        <button class="wedge" data-stall="meat" aria-label="肉攤"></button>
        <button class="wedge" data-stall="dry" aria-label="乾貨攤"></button>
        <button class="wedge" data-stall="fruit" aria-label="水果攤"></button>
        <button class="wedge" data-stall="vegetable" aria-label="蔬菜攤"></button>
        <button class="wedge" data-stall="seafood" aria-label="海鮮攤"></button>
        <svg class="pentagon-lines" viewBox="0 0 334 316" preserveAspectRatio="none" aria-hidden="true"><polygon points="166,1 333,118 274,315 66,315 0,127"/><line x1="167" y1="171" x2="166" y2="1"/><line x1="167" y1="171" x2="333" y2="118"/><line x1="167" y1="171" x2="274" y2="315"/><line x1="167" y1="171" x2="66" y2="315"/><line x1="167" y1="171" x2="0" y2="127"/></svg>
      </div>
      <div class="market-screen hidden" id="foodPage" aria-label="食物圖片選擇頁"></div>
    </section>
    <section class="hud" aria-live="polite">
      <div class="timerbox"><div class="timertext">剩餘時間</div><div class="timer" id="timer">10.0</div><div class="track"><div class="fill" id="fill"></div></div></div>
    </section>
    <p class="prompt" id="prompt">按下「開始遊戲」，每題限時 10 秒！</p>
    <p class="help">硬體操作：按鈕依五角形順時針、從頂端起對應 1–5　・　鍵盤也可按 1–5</p>
  </main>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div>
<script>
const stalls={
meat:{name:'肉攤',items:[['🥩','豬絞肉','ground pork','assets/food/ground-pork.jpg'],['🍗','雞腿','chicken drumstick','assets/food/chicken-roasted.jpeg'],['🥓','培根','bacon','assets/food/bacon.jpg'],['🍖','牛排','beef steak','assets/food/beef-tbone.jpg'],['🌭','香腸','sausage','assets/food/sausage.jpg']]},
vegetable:{name:'菜攤',items:[['🟢','豌豆','peas'],['🥕','紅蘿蔔','carrot'],['🥬','菠菜','spinach'],['🌽','玉米','corn'],['🥦','花椰菜','cauliflower']]},
fruit:{name:'水果攤',items:[['🍎','蘋果','apple fruit','assets/food/apple.jpg'],['🍌','香蕉','banana fruit','assets/food/banana.jpg'],['🍊','橘子','orange fruit','assets/food/orange.jpg'],['🍇','葡萄','grapes','assets/food/grapes.jpg'],['🍉','西瓜','watermelon','assets/food/watermelon.jpg']]},
seafood:{name:'海鮮攤',items:[['🐟','魚','whole fish','assets/food/fish.jpg'],['🦐','蝦子','shrimp','assets/food/shrimp.jpg'],['🦀','螃蟹','crab','assets/food/crab.jpg'],['🦪','蛤蜊','clams','assets/food/clams.webp'],['🦑','透抽','squid','assets/food/squid.jpg']]},
dry:{name:'乾貨攤',items:[['🍄','香菇','dried shiitake mushroom','assets/food/shiitake.jpg'],['🥜','花生','peanuts','assets/food/peanuts.jpg'],['🫘','紅豆','red beans','assets/food/redbeans.jpg'],['🍚','白米','rice grains','assets/food/rice.jpg'],['🍜','麵條','noodles','assets/food/noodles.png']]}
};
const all=Object.entries(stalls).flatMap(([stall,data])=>data.items.map(([emoji,name,photo,photoUrl])=>({stall,emoji,name,photo,photoUrl})));
let round=0,rounds=5,selectedStall=null,questionItems=[],selectedNames=new Set(),remaining=10,clock=null,active=false,locked=false,score=0;
const $=id=>document.getElementById(id), stallEls=[...document.querySelectorAll('#stallPage [data-stall]')];
function showModal(icon,title,copy,button,action){$('modal').innerHTML=`<div class="big">${icon}</div><h2>${title}</h2><p>${copy}</p><button class="primary" id="modalButton">${button}</button>`;$('overlay').classList.remove('hidden');$('modalButton').onclick=action}
function start(){round=0;score=0;active=true;locked=false;$('overlay').classList.add('hidden');nextRound()}
function nextRound(){if(round>=rounds){active=false;clearInterval(clock);updateProgress();showModal('🏆','採買完成！',`太厲害了！你完成了 ${score} 回合採買。`,'再玩一次',start);return}locked=false;selectedStall=null;questionItems=[];selectedNames=new Set();clearInterval(clock);$('target').textContent='';$('questionLabel').textContent='選擇你想逛的攤商';$('pageHint').textContent=`第 ${round+1} 回合｜選攤商`;$('stallPage').classList.remove('hidden');$('foodPage').classList.add('hidden');$('prompt').textContent='在五角形裡選一個攤商，開始本回合。';$('timer').textContent='10.0';$('fill').style.width='100%';$('fill').style.background='#56a96d';stallEls.forEach(s=>s.classList.remove('active','wrong'));updateProgress()}
function updateProgress(){$('progress').textContent=`回合 ${Math.min(round+1,rounds)} / ${rounds}　・　⭐ ${score}`}
function showFoodPage(){locked=false;$('stallPage').classList.add('hidden');$('foodPage').classList.remove('hidden');$('questionLabel').textContent='請找這兩樣';$('target').textContent=questionItems.map(item=>item.name).join('、');$('pageHint').textContent=`第 ${round+1} 回合｜第 2 頁：選兩張照片`;$('prompt').textContent='在五角形裡選出題目上的兩樣食物。';renderChoices();remaining=10;$('timer').textContent='10.0';$('fill').style.width='100%';$('fill').style.background='#56a96d';clearInterval(clock);clock=setInterval(tick,100)}
function renderChoices(){const allItems=stalls[selectedStall].items.map(([emoji,name,photo,photoUrl])=>({emoji,name,photo,photoUrl})),pool=selectedStall==='vegetable'?allItems:[...allItems].sort(()=>Math.random()-.5),sample=selectedStall==='vegetable',slices=['polygon(50% 54%,50% 0%,100% 37%)','polygon(50% 54%,100% 37%,82% 100%)','polygon(50% 54%,82% 100%,20% 100%)','polygon(50% 54%,20% 100%,0% 40%)','polygon(50% 54%,0% 40%,50% 0%)'],frames=selectedStall==='fruit'?[['67%','4%','25%','32%'],['66%','47%','26%','34%'],['32%','67%','36%','29%'],['8%','47%','27%','34%'],['8%','7%','35%','28%']]:[['50%','0%','50%','54%'],['50%','37%','50%','63%'],['20%','54%','62%','46%'],['0%','40%','50%','60%'],['0%','0%','50%','54%']];$('foodPage').innerHTML=(sample?'<img class="sample-wheel" src="assets/vegetable-options-wheel.png" alt="" />':'')+pool.map((item,i)=>{const [left,top,width,height]=frames[i],fruitClass=selectedStall==='fruit'?'fruit-option':'';return `<button class="wedge food-option ${fruitClass}" style="--slice:${slices[i]};--photo-left:${left};--photo-top:${top};--photo-width:${width};--photo-height:${height}" data-name="${item.name}" aria-label="第 ${i+1} 張食物圖片">${sample?'':`<img loading="eager" decoding="async" src="${item.photoUrl}" alt="" />`}</button>`}).join('')+'<svg class="pentagon-lines" viewBox="0 0 334 316" preserveAspectRatio="none" aria-hidden="true"><polygon points="166,1 333,118 274,315 66,315 0,127"/><line x1="167" y1="171" x2="166" y2="1"/><line x1="167" y1="171" x2="333" y2="118"/><line x1="167" y1="171" x2="274" y2="315"/><line x1="167" y1="171" x2="66" y2="315"/><line x1="167" y1="171" x2="0" y2="127"/></svg>';[...$('foodPage').querySelectorAll('.food-option')].forEach((btn,i)=>{btn.onclick=()=>chooseFood(i)})}
function tick(){if(!active||locked)return;remaining=Math.max(0,remaining-.1);$('timer').textContent=remaining.toFixed(1);$('fill').style.width=`${remaining*10}%`;if(remaining<=3)$('fill').style.background='#d94b36';if(remaining<=0){clearInterval(clock);locked=true;$('prompt').textContent='時間到！下一回合開始囉。';toast('⏰ 時間到！');setTimeout(()=>{round++;nextRound()},900)}}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),850)}
function chooseFood(i){if(!active||locked)return;const buttons=[...$('foodPage').querySelectorAll('.food-option')],btn=buttons[i],name=btn.dataset.name;if(selectedNames.has(name)){toast('這張已經選過了！');return}if(questionItems.some(item=>item.name===name)){selectedNames.add(name);btn.classList.add('selected');toast(`✅ ${name}`);if(selectedNames.size===2){score++;locked=true;clearInterval(clock);$('prompt').textContent='兩樣都找到了！下一回合準備開始。';setTimeout(()=>{round++;nextRound()},700)}}else{btn.classList.add('active');setTimeout(()=>btn.classList.remove('active'),450);toast('再找找看！時間繼續')}}
stallEls.forEach(el=>el.onclick=()=>{if(!active||locked)return;selectedStall=el.dataset.stall;const pool=[...stalls[selectedStall].items].sort(()=>Math.random()-.5);questionItems=pool.slice(0,2).map(([emoji,name,photo])=>({emoji,name,photo}));showFoodPage()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!active){start();return}if(!active||locked)return;if(/^[1-5]$/.test(e.key)){const slot=Number(e.key)-1;if(!$('stallPage').classList.contains('hidden')){const button=stallEls[slot];if(button)button.click()}else chooseFood(slot)}});
showModal('🧺','逛市場・買對好物','每回合先自由選一個攤商，再依題目上的兩個食物名稱，在五角形照片中選出這兩樣。選好攤商後限時 10 秒；每次選項都沒有文字或圖示，五個按鈕依順時針由頂端對應 1–5。','開始遊戲',start);
</script>
</body>
</html>
