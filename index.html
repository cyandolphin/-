<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <title>IEYI｜菜市場大冒險</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    :root{--ink:#26362d;--cream:#fff8e8;--red:#d94b36;--green:#237c58;--yellow:#ffd44d;--shadow:0 7px 0 #173c2c}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#f8dc9a;color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;display:grid;place-items:center;padding:18px}
    button{font:inherit;cursor:pointer;color:inherit} .game{width:min(1080px,100%);min-height:min(760px,calc(100vh - 36px));position:relative;overflow:hidden;border:5px solid #633d27;border-radius:26px;background:var(--cream);box-shadow:0 14px 0 #633d27,0 22px 45px #673e2850;display:flex;flex-direction:column}
    .awning{height:24px;background:repeating-linear-gradient(90deg,#d94b36 0 54px,#fff6d7 54px 108px);border-bottom:4px solid #633d27}
    header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 10px;gap:12px}.brand{font-weight:900;font-size:clamp(19px,3vw,27px);letter-spacing:.03em}.brand span{color:var(--red)}.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.score{font-weight:800;background:#eaf2d7;border:2px solid #9cbd80;border-radius:99px;padding:7px 14px;white-space:nowrap}.stop-button{border:2px solid #d9a399;border-radius:99px;background:#fff;color:#a53d31;padding:6px 12px;font-weight:800;white-space:nowrap}.round-button{border:2px solid #7fa77d;border-radius:99px;background:#f0f8e9;color:#315e3d;padding:6px 12px;font-weight:800;white-space:nowrap}.stop-button:hover,.stop-button:focus-visible{background:#fff0ec}.round-button:hover,.round-button:focus-visible{background:#e0efd5}.round-grid{display:grid;grid-template-columns:repeat(5,minmax(82px,1fr));gap:10px;margin:16px 0}.round-choice{border:2px solid #91b180;border-radius:12px;background:#fff;padding:10px 6px;font-weight:900;color:#315e3d}.round-choice:hover,.round-choice:focus-visible{background:#eaf4df;outline:3px solid #f0c95e}.round-choice.current{background:#f8e7b8;border-color:#c99d37}
    .main{flex:1;padding:4px 24px 20px;display:flex;flex-direction:column;gap:14px}.headline{text-align:center;margin:0;font-size:clamp(23px,4vw,38px);font-weight:900}.subtitle{text-align:center;margin:-10px 0 0;color:#6c746a;font-size:14px}
    .question{background:#fff;border:3px solid #ead5a9;border-radius:16px;padding:9px 18px;text-align:center}.question-label{font-size:12px;color:#7d776b;font-weight:700}.target{font-size:clamp(24px,4vw,34px);font-weight:900;color:var(--red);min-height:1.3em}.wedge.selected{filter:none}
    .market{position:relative;flex:1;min-height:380px;border:3px solid #97b77e;border-radius:22px;background:linear-gradient(#d9f1e8 0 65%,#f5d08a 65%);overflow:hidden;padding:16px;display:grid;place-items:center}
    .market:before{content:'傳統市場・早安！';position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#4c765f;font-size:12px;font-weight:700;letter-spacing:.18em;white-space:nowrap;z-index:4}
    .market-screen{position:relative;width:min(420px,100%);height:auto;aspect-ratio:334 / 316;margin-top:12px}.market-screen.hidden{display:none}.sample-wheel{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:0}.wedge{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;clip-path:var(--slice);background:transparent;padding:0;transition:filter .14s;z-index:2}.wedge:nth-of-type(1){--slice:polygon(50% 54%,50% 0%,100% 37%)}.wedge:nth-of-type(2){--slice:polygon(50% 54%,100% 37%,82% 100%)}.wedge:nth-of-type(3){--slice:polygon(50% 54%,82% 100%,20% 100%)}.wedge:nth-of-type(4){--slice:polygon(50% 54%,20% 100%,0% 40%)}.wedge:nth-of-type(5){--slice:polygon(50% 54%,0% 40%,50% 0%)}.wedge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.wedge:hover,.wedge:focus-visible{filter:brightness(.9);outline:none}.wedge.active{filter:brightness(.65) saturate(1.2)}.drygoods-replacement{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:polygon(50% 54%,100% 37%,82% 100%);pointer-events:none;z-index:1}
    .pentagon-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.pentagon-lines polygon,.pentagon-lines line{fill:none;stroke:#fff;stroke-width:3}.pentagon-lines .choice-outline{fill:none;stroke:#ff8a24;stroke-width:3;stroke-linejoin:round;visibility:hidden}.pentagon-lines .choice-outline.visible{visibility:visible}
    .hud{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:center}.timerbox{text-align:center}.timertext{font-size:12px;font-weight:800;color:#6b756d}.timer{font-size:31px;line-height:1;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}.track{height:9px;border-radius:99px;background:#eadcc2;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;background:#56a96d;border-radius:inherit;transition:width .1s linear,background .2s}
    .prompt{text-align:center;font-weight:800;margin:0;font-size:14px}.help{text-align:center;color:#847969;font-size:12px;margin:0}.toast{position:absolute;z-index:4;top:54px;left:50%;transform:translate(-50%,-15px);padding:7px 13px;background:#567a61;color:white;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .overlay{position:absolute;z-index:5;inset:24px 0 0;background:#254534dc;display:grid;place-items:center;padding:20px}.modal{width:min(540px,100%);background:var(--cream);border:4px solid #633d27;border-radius:24px;box-shadow:0 9px 0 #633d27;padding:30px 28px;text-align:center}.modal .big{font-size:66px;line-height:1.2}.modal h2{font-size:clamp(26px,5vw,38px);margin:4px 0 8px}.modal p{color:#687166;line-height:1.7;margin:4px auto 18px;max-width:430px}.primary{border:0;border-radius:14px;background:var(--red);color:white;font-weight:900;font-size:19px;padding:12px 26px;box-shadow:0 5px 0 #9d3528}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #9d3528}.hidden{display:none!important}
    @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    .food-option img{inset:auto;left:var(--photo-left);top:var(--photo-top);width:var(--photo-width);height:var(--photo-height);object-fit:cover}
    .fruit-option img{object-fit:cover}
    .success-ribbon{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg) scale(.65);padding:10px 30px;background:repeating-linear-gradient(135deg,#d94b36 0 12px,#f7be45 12px 24px);border:4px solid #fff;border-radius:10px;box-shadow:0 5px 0 #633d27,0 8px 20px #26362d70;color:#fff;font-size:clamp(27px,6vw,43px);font-weight:900;letter-spacing:.16em;text-shadow:0 2px 3px #633d27;white-space:nowrap;opacity:0;pointer-events:none}.success-ribbon.show{animation:ribbon-pop 1.15s ease-out forwards}.success-ribbon.wrong{padding:7px 15px;background:#fff8e8;border:2px solid #d9c79e;box-shadow:0 3px 9px #26362d35;color:#596c57;font-size:clamp(14px,3vw,18px);font-weight:700;letter-spacing:0;text-shadow:none;transform:translate(-50%,-50%)}.success-ribbon.wrong.show{animation:wrong-pop 1.1s ease-out forwards}@keyframes ribbon-pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.35)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1.08)}32%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}@keyframes wrong-pop{0%{opacity:0}15%{opacity:1}78%{opacity:1}100%{opacity:0}}
    @media(max-width:700px){body{padding:8px}.game{min-height:calc(100vh - 22px);border-radius:18px}.awning{height:16px}header{padding:10px 14px 5px}.main{padding:4px 12px 14px;gap:10px}.market{min-height:300px;padding:12px 7px}.market-screen{width:min(300px,100%)}.hud{grid-template-columns:1fr;gap:8px}.timer{font-size:26px}.help{font-size:10px}.round-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.round-choice{font-size:13px;padding:8px 4px}}
    @media(max-width:390px){.market{min-height:275px;padding-inline:4px}.market-screen{width:min(270px,100%)}.score{font-size:12px;padding:5px 9px}}
  </style>
</head>
<body>
<div class="game" aria-label="IEYI 傳統市場遊戲">
  <div class="awning"></div>
  <header><div class="brand">IEYI <span>｜菜市場大冒險</span></div><div class="header-actions"><div class="score" id="progress">第 1 回合｜任務 1 / 5　・　⭐ 0</div><button class="round-button" id="roundMenuButton" type="button" onclick="showRoundMenu()">回合選單</button><button class="stop-button" id="stopButton" type="button" onclick="stopGame()">停止遊戲</button></div></header>
  <main class="main">
    <h1 class="headline">市場採買任務</h1>
    <p class="subtitle" id="pageHint">第 1 頁｜先找到正確的攤商</p>
    <div class="question"><div class="question-label" id="questionLabel">選擇你想逛的攤商</div><div class="target" id="target"></div></div>
    <section class="market" aria-label="市場五角形操作區">
      <div class="market-screen" id="stallPage" aria-label="攤商選擇頁">
        <img class="sample-wheel" src="assets/market-stalls-wheel.png" alt="" />
        <img class="drygoods-replacement" src="drygoods-market-mix.jpg" alt="" />
        <button class="wedge" data-stall="meat" aria-label="肉攤"></button>
        <button class="wedge" data-stall="dry" aria-label="乾貨攤"></button>
        <button class="wedge" data-stall="fruit" aria-label="水果攤"></button>
        <button class="wedge" data-stall="vegetable" aria-label="蔬菜攤"></button>
        <button class="wedge" data-stall="seafood" aria-label="海鮮攤"></button>
        <svg class="pentagon-lines" viewBox="0 0 334 316" preserveAspectRatio="none" aria-hidden="true"><polygon points="166,1 333,118 274,315 66,315 0,127"/><line x1="167" y1="171" x2="166" y2="1"/><line x1="167" y1="171" x2="333" y2="118"/><line x1="167" y1="171" x2="274" y2="315"/><line x1="167" y1="171" x2="66" y2="315"/><line x1="167" y1="171" x2="0" y2="127"/></svg>
      </div>
      <div class="market-screen hidden" id="foodPage" aria-label="食物圖片選擇頁"></div>
      <div class="success-ribbon" id="successRibbon" aria-live="assertive">成功</div>
    </section>
    <section class="hud" aria-live="polite">
      <div class="timerbox"><div class="timertext">剩餘時間</div><div class="timer" id="timer">10.0</div><div class="track"><div class="fill" id="fill"></div></div></div>
    </section>
    <p class="prompt" id="prompt">按下「開始遊戲」，每題限時 10 秒！</p>
    <p class="help">硬體操作：按鈕依五角形順時針、從頂端起對應 1–5　・　鍵盤也可按 1–5</p>
  </main>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</div>
<script>
const stalls={
meat:{name:'肉攤',items:[['🥩','豬絞肉','ground pork','assets/food/ground-pork.jpg'],['🍗','雞腿','chicken drumstick','assets/food/chicken-roasted.jpeg'],['🥓','培根','bacon','assets/food/bacon.jpg'],['🍖','牛排','beef steak','assets/food/beef-tbone.jpg'],['🌭','香腸','sausage','assets/food/sausage.jpg']],round2Items:[['🍖','排骨','pork ribs','assets/food/round2-meat-pork-ribs.jpg'],['🍗','雞胸肉','chicken breast','assets/food/round2-meat-chicken-breast.jpg'],['🥩','羊排','lamb chops','assets/food/round2-meat-lamb-chops.jpg'],['🥓','五花肉','pork belly','assets/food/round2-meat-pork-belly.jpg'],['🥩','牛絞肉','ground beef','assets/food/round2-meat-ground-beef.jpg']]},
vegetable:{name:'菜攤',items:[['🟢','豌豆','peas'],['🥕','紅蘿蔔','carrot'],['🥬','菠菜','spinach'],['🌽','玉米','corn'],['🥦','花椰菜','cauliflower']],round2Items:[['🥬','高麗菜','cabbage','assets/food/round2-veg-cabbage.jpg'],['🍆','茄子','eggplant','assets/food/round2-veg-eggplant.jpg'],['🥔','馬鈴薯','potatoes','assets/food/round2-veg-potatoes.jpg'],['🧅','洋蔥','onion','assets/food/round2-veg-onion.jpg'],['🍅','番茄','tomatoes','assets/food/round2-veg-tomatoes.jpg']]},
fruit:{name:'水果攤',items:[['🍎','蘋果','apple pile','assets/food/apple-pile.webp'],['🍌','香蕉','banana pile','assets/food/banana-pile.jpg'],['🍊','橘子','orange pile','assets/food/orange-pile.jpg'],['🍇','葡萄','grapes pile','assets/food/grapes-pile.jpg'],['🍉','西瓜','watermelon pile','assets/food/watermelon-pile.jpg']],round2Items:[['🍐','梨子','pears','assets/food/round2-fruit-pear.jpg'],['🍍','鳳梨','pineapples','assets/food/round2-fruit-pineapple.jpg'],['🍓','草莓','strawberries','assets/food/round2-fruit-strawberries.jpg'],['🥭','芒果','mangoes','assets/food/round2-fruit-mango.jpg'],['🥝','奇異果','kiwifruit','assets/food/round2-fruit-kiwi.jpg']]},
seafood:{name:'海鮮攤',items:[['🐟','魚','whole fish','assets/food/fish.jpg'],['🦐','蝦子','cooked shrimp','assets/food/shrimp-cooked.jpg'],['🦀','螃蟹','crab','assets/food/crab.jpg'],['🦪','蛤蜊','clams','assets/food/clams.webp'],['🦑','透抽','squid','assets/food/squid.jpg']],round2Items:[['🐟','鮭魚','salmon','assets/food/round2-seafood-salmon.jpg'],['🦞','龍蝦','lobster','assets/food/round2-seafood-lobster.jpg'],['🦪','淡菜','mussels','assets/food/round2-seafood-mussels.jpg'],['🐚','干貝','scallops','assets/food/round2-seafood-scallops.jpg'],['🐟','鰻魚','eel','assets/food/round2-seafood-eel.jpg']]},
dry:{name:'乾貨攤',items:[['🍄','香菇','dried shiitake mushroom','assets/food/shiitake.jpg'],['🥜','花生','peanuts','assets/food/peanuts.jpg'],['🫘','紅豆','red beans','assets/food/redbeans.jpg'],['🍚','白米','rice grains','assets/food/rice.jpg'],['🍜','麵條','noodles','assets/food/noodles.png']],round2Items:[['🧄','蒜頭','garlic','assets/food/round2-dry-garlic.jpg'],['🥚','雞蛋','eggs','assets/food/round2-dry-eggs.jpg'],['🦐','蝦米','dried shrimp','assets/food/round2-dry-shrimp.jpg'],['🌿','海帶','dried kelp','assets/food/round2-dry-kelp.jpg'],['🍒','紅棗','red dates','assets/food/round2-dry-jujube.jpg']]}
};
const all=Object.entries(stalls).flatMap(([stall,data])=>data.items.map(([emoji,name,photo,photoUrl])=>({stall,emoji,name,photo,photoUrl})));
let round=1,rounds=2,quest=0,questsPerRound=5,selectedStall=null,questionItems=[],selectedNames=new Set(),remaining=10,clock=null,active=false,locked=false,score=0;
let roundStalls=Array(rounds+1).fill(null);
const $=id=>document.getElementById(id), stallEls=[...document.querySelectorAll('#stallPage [data-stall]')];
function showModal(icon,title,copy,button,action,secondButton,secondAction){$('modal').innerHTML=`<div class="big">${icon}</div><h2>${title}</h2><p>${copy}</p><button class="primary" id="modalButton">${button}</button>${secondButton?` <button class="round-button" id="modalSecondButton" type="button">${secondButton}</button>`:''}`;$('overlay').classList.remove('hidden');$('modalButton').onclick=action;if(secondButton)$('modalSecondButton').onclick=secondAction}
function start(){round=1;quest=0;score=0;roundStalls=Array(rounds+1).fill(null);active=true;locked=false;$('overlay').classList.add('hidden');nextRound()}
function chooseRound(number){round=number;quest=0;selectedStall=null;active=true;locked=false;clearInterval(clock);$('overlay').classList.add('hidden');nextRound()}
function showRoundMenu(){clearInterval(clock);locked=true;$('modal').innerHTML=`<div class="big">🗓️</div><h2>選擇回合</h2><p>選一個回合開始，會從該回合第 1 題重新玩。</p><div class="round-grid">${Array.from({length:rounds},(_,i)=>`<button class="round-choice ${round===i+1?'current':''}" data-round="${i+1}">第 ${i+1} 回合</button>`).join('')}</div>`;$('overlay').classList.remove('hidden');[...$('modal').querySelectorAll('.round-choice')].forEach(button=>button.onclick=()=>chooseRound(Number(button.dataset.round)))}
function stopGame(){active=false;locked=true;clearInterval(clock);$('prompt').textContent='遊戲已停止。';showModal('⏹️','遊戲已停止',`目前完成 ${score} 題。你可以重新開始遊戲。`,'重新開始',start)}
function roundItemList(){const assignment=roundStalls[round];if(!assignment)return[];return assignment.set===0?stalls[assignment.stall].items:stalls[assignment.stall].round2Items}
function prepareQuestion(){const pool=[...roundItemList()].sort(()=>Math.random()-.5);questionItems=pool.slice(0,2).map(([emoji,name,photo,photoUrl])=>({emoji,name,photo,photoUrl}));showFoodPage()}
function showStallPage(){locked=false;selectedStall=null;questionItems=[];selectedNames=new Set();clearInterval(clock);$('target').textContent='';$('questionLabel').textContent='選擇本回合要逛的攤商';$('pageHint').textContent=`第 ${round} 回合｜選擇攤商（本回合 5 題共用 5 個食物選項）`;$('stallPage').classList.remove('hidden');$('foodPage').classList.add('hidden');$('prompt').textContent='在五角形裡選一個攤商，開始本回合。';$('timer').textContent='10.0';$('fill').style.width='100%';$('fill').style.background='#56a96d';stallEls.forEach(el=>{el.classList.remove('active','wrong');const uses=roundStalls.filter(x=>x&&x.stall===el.dataset.stall).length;el.disabled=!roundStalls[round]&&uses>=2;el.setAttribute('aria-disabled',String(el.disabled));el.title=el.disabled?'此攤商的兩組食物選項都已使用':''});updateProgress()}
function nextRound(){if(quest>=questsPerRound){if(round>=rounds){active=false;clearInterval(clock);updateProgress();showModal('🏆','兩回合採買完成！',`太厲害了！你完成了 ${score} 題採買。`,'再玩一次',start);return}round++;quest=0;selectedStall=null}locked=false;selectedNames=new Set();clearInterval(clock);if(roundStalls[round]){selectedStall=roundStalls[round].stall;prepareQuestion()}else showStallPage()}
function updateProgress(){$('progress').textContent=`第 ${round} 回合｜任務 ${Math.min(quest+1,questsPerRound)} / ${questsPerRound}　・　⭐ ${score}`}
function showFoodPage(){locked=false;$('successRibbon').classList.remove('show','wrong');$('successRibbon').textContent='成功';$('stallPage').classList.add('hidden');$('foodPage').classList.remove('hidden');$('questionLabel').textContent='請找這兩樣';$('target').textContent=questionItems.map(item=>item.name).join('、');$('pageHint').textContent=`第 ${round} 回合｜任務 ${quest+1} / ${questsPerRound}｜第 2 頁：選兩張照片`;$('prompt').textContent='在五角形裡選出題目上的兩樣食物。';renderChoices();remaining=10;$('timer').textContent='10.0';$('fill').style.width='100%';$('fill').style.background='#56a96d';clearInterval(clock);clock=setInterval(tick,100)}
function renderChoices(){const items=roundItemList(),allItems=items.map(([emoji,name,photo,photoUrl])=>({emoji,name,photo,photoUrl})),sample=selectedStall==='vegetable'&&roundStalls[round]?.set===0,pool=sample?allItems:[...allItems].sort(()=>Math.random()-.5),slices=['polygon(50% 54%,50% 0%,100% 37%)','polygon(50% 54%,100% 37%,82% 100%)','polygon(50% 54%,82% 100%,20% 100%)','polygon(50% 54%,20% 100%,0% 40%)','polygon(50% 54%,0% 40%,50% 0%)'],frames=[['50%','0%','50%','54%'],['50%','37%','50%','63%'],['20%','54%','62%','46%'],['0%','40%','50%','60%'],['0%','0%','50%','54%']];$('foodPage').innerHTML=(sample?'<img class="sample-wheel" src="assets/vegetable-options-wheel.png" alt="" />':'')+pool.map((item,i)=>{const [left,top,width,height]=frames[i],fruitClass=selectedStall==='fruit'?'fruit-option':'';return `<button class="wedge food-option ${fruitClass}" style="--slice:${slices[i]};--photo-left:${left};--photo-top:${top};--photo-width:${width};--photo-height:${height}" data-name="${item.name}" aria-label="第 ${i+1} 張食物圖片">${sample?'':`<img loading="eager" decoding="async" src="${item.photoUrl}" alt="" />`}</button>`}).join('')+'<svg class="pentagon-lines" viewBox="0 0 334 316" preserveAspectRatio="none" aria-hidden="true"><polygon points="166,1 333,118 274,315 66,315 0,127"/><line x1="167" y1="171" x2="166" y2="1"/><line x1="167" y1="171" x2="333" y2="118"/><line x1="167" y1="171" x2="274" y2="315"/><line x1="167" y1="171" x2="66" y2="315"/><line x1="167" y1="171" x2="0" y2="127"/></svg>';[...$('foodPage').querySelectorAll('.food-option')].forEach((btn,i)=>{btn.onclick=()=>chooseFood(i)})}
function tick(){if(!active||locked)return;remaining=Math.max(0,remaining-.1);$('timer').textContent=remaining.toFixed(1);$('fill').style.width=`${remaining*10}%`;if(remaining<=3)$('fill').style.background='#d94b36';if(remaining<=0){clearInterval(clock);locked=true;$('prompt').textContent='時間到！下一題開始囉。';$('successRibbon').classList.remove('show','wrong');$('successRibbon').textContent='時間到！';void $('successRibbon').offsetWidth;$('successRibbon').classList.add('wrong','show');setTimeout(()=>{quest++;nextRound()},1100)}}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),850)}
function chooseFood(i){if(!active||locked)return;const buttons=[...$('foodPage').querySelectorAll('.food-option')],btn=buttons[i],name=btn.dataset.name,points=['167,171 166,1 333,118','167,171 333,118 274,315','167,171 274,315 66,315','167,171 66,315 0,127','167,171 0,127 166,1'],svg=$('foodPage').querySelector('svg');if(selectedNames.has(name)){toast('這張已經選過了！');return}const outline=document.createElementNS('http://www.w3.org/2000/svg','polygon');outline.setAttribute('points',points[i]);outline.setAttribute('class','choice-outline visible');svg.appendChild(outline);if(questionItems.some(item=>item.name===name)){selectedNames.add(name);btn.classList.add('selected');toast(`✅ ${name}`);if(selectedNames.size===2){score++;locked=true;clearInterval(clock);$('successRibbon').classList.remove('show','wrong');$('successRibbon').textContent='成功';void $('successRibbon').offsetWidth;$('successRibbon').classList.add('show');$('prompt').textContent='兩樣都找到了！下一題準備開始。';setTimeout(()=>{quest++;nextRound()},1100)}}else{btn.classList.add('active');setTimeout(()=>btn.classList.remove('active'),450);setTimeout(()=>outline.remove(),500);$('successRibbon').classList.remove('show','wrong');$('successRibbon').textContent='不是這個，再試試看！';void $('successRibbon').offsetWidth;$('successRibbon').classList.add('wrong','show')}}
stallEls.forEach(el=>el.onclick=()=>{if(!active||locked||el.disabled)return;selectedStall=el.dataset.stall;const uses=roundStalls.filter(x=>x&&x.stall===selectedStall).length;roundStalls[round]={stall:selectedStall,set:uses===0?0:1};prepareQuestion()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!active){start();return}if(!active||locked)return;if(/^[1-5]$/.test(e.key)){const slot=Number(e.key)-1;if(!$('stallPage').classList.contains('hidden')){const button=stallEls[slot];if(button)button.click()}else chooseFood(slot)}});
showModal('🧺','逛市場・買對好物','遊戲共有 2 回合，每回合 5 題。每題先自由選一個攤商，再依題目上的兩個食物名稱，在五角形照片中選出這兩樣，限時 10 秒。第 2 回合起使用第二組食物照片，並隨機配對任務；五個按鈕依順時針由頂端對應 1–5。','開始第 1 回合',start,'選擇回合',showRoundMenu);
